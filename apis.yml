name: Allswell
description: Allswell is an online mental health platform providing virtual, trauma-informed
  therapy for the LGBTQ+ community. Licensed therapists with master's degrees in social work,
  counseling, or marriage and family therapy deliver individual telehealth sessions alongside
  peer support groups and skills-building resources, covering trauma, anxiety, depression,
  identity exploration, and relationship dynamics. Allswell serves clients in Maryland, DC, and
  Virginia, accepting Medicaid and major insurance plans as well as cash-pay. Backed by Techstars,
  it is tracked in the API Evangelist network as a company profile; it publishes no public
  developer or API surface.
